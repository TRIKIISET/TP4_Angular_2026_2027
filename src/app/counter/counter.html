<h1>Compteur sans signal</h1>
<p>Valeur: {{valeur}}</p>
<p> Carré: {{carre}}</p>
<p>Pair: {{pair}}</p> 
<button type="button" (click)="incrementValeur()">Incrémenter</button>
<button type="button" (click)="initValeur()">Reset</button>

<h1>Compteur avec signal</h1>
<p>Valeur: {{value()}}</p>
<p> Carré: {{square()}}</p>
<p>Pair: {{even()}}</p> 
<button type="button" (click)="increment()">Incrémenter</button>
<button type="button" (click)="reset()">Reset</button>
